<!doctype html><html lang="en"><meta charset="utf-8"><title>Original Afterglow / studio audio comparison</title><pre id="results">Running…</pre><script type="module">
import {createInitialState} from '../clawstudio/state.js';
const results=document.querySelector('#results'),lines=[];
const module=await WebAssembly.compile(await(await fetch('../clawstudio/afterglow.wasm')).arrayBuffer());
const assert=(test,message)=>{if(!test)throw Error(message)};
async function compare(state,sampleRate,samples=[]){
 const ctx=new OfflineAudioContext(4,Math.round(sampleRate*2.2),sampleRate);
 await ctx.audioWorklet.addModule('./fixtures/afterglow/reference-worklet.js');await ctx.audioWorklet.addModule('../clawstudio/worklet.js');
 const merger=ctx.createChannelMerger(4);merger.connect(ctx.destination);
 const nodes=await Promise.all(['afterglow-reference','afterglow-processor'].map(name=>new Promise((resolve,reject)=>{
  const node=new AudioWorkletNode(ctx,name,{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2],processorOptions:{module,state}});
  node.port.onmessage=({data})=>{if(data.type==='ready')resolve(node);if(data.type==='error')reject(Error(data.message))};node.onprocessorerror=()=>reject(Error(name+' failed'));
 })));
 const command=(node,data)=>new Promise((resolve,reject)=>{node.port.onmessage=({data})=>{if(data.type==='ack')resolve();if(data.type==='error')reject(Error(data.message))};node.port.postMessage({...data,requestId:1})});
 for(let i=0;i<2;i++){
  const node=nodes[i],splitter=ctx.createChannelSplitter(2);node.connect(splitter);splitter.connect(merger,0,i*2);splitter.connect(merger,1,i*2+1);
  for(const [voice,sample] of samples)await command(node,{type:'sample',voice,...sample});
  await command(node,{type:'play'});
 }
 const buffer=await ctx.startRendering();let sum=0,diff=0,peak=0,maximum=0;
 for(let c=0;c<2;c++){const ref=buffer.getChannelData(c),actual=buffer.getChannelData(c+2);for(let i=0;i<ref.length;i++){const error=actual[i]-ref[i];sum+=ref[i]**2;diff+=error**2;maximum=Math.max(maximum,Math.abs(error));peak=Math.max(peak,Math.abs(ref[i]))}}
 for(const node of nodes)await command(node,{type:'dispose'});
 return {rms:Math.sqrt(sum/(buffer.length*2)),difference:Math.sqrt(diff/(buffer.length*2)),peak,maximum};
}
try{
 for(const model of [0,1,3,4]){
  const state=createInitialState();state.voices.forEach(v=>{v.model=model;v.drive=.15;v.tune=.3;v.pan=.12});state.tempo=124;state.swing=.21;state.bank.patterns[0].steps.forEach((row,v)=>{row[(v+1)%16].on=true;row[(v+1)%16].ratchets=v%3+1;row[(v+1)%16].probability=.83});
  const audio=await compare(state,48000);assert(audio.rms>1e-4,'reference audio is audible');assert(audio.maximum===0,'exact worklet parity for model '+model);lines.push('PASS model '+model+' — sample-identical output at 48 kHz, with swing, repeats, chance, tuning, drive and pan; RMS '+(20*Math.log10(audio.rms)).toFixed(2)+' dBFS, peak '+(20*Math.log10(audio.peak)).toFixed(2)+' dBFS');results.textContent=lines.join('\n');
 }
 for(const rate of [44100,96000]){const state=createInitialState();state.voices.forEach((v,i)=>{v.model=[0,1,3,4][i%4]});const audio=await compare(state,rate);assert(audio.maximum===0,'mixed engines exact at '+rate);lines.push('PASS mixed engine kit — sample-identical output at '+rate+' Hz');results.textContent=lines.join('\n')}
 const sampleRate=48000,left=Float32Array.from({length:4800},(_,i)=>Math.sin(i*.05)*.4*(1-i/4800)),right=Float32Array.from({length:4800},(_,i)=>Math.cos(i*.09)*.2*(1-i/4800));
 const state=createInitialState();state.voices[0].model=2;state.voices[0].reverse=true;state.voices[0].sampleStart=.13;state.voices[0].sampleEnd=.86;state.voices[0].tune=3.2;
 const audio=await compare(state,sampleRate,[[0,{left,right,sampleRate}]]);assert(audio.maximum===0,'stereo sample/reverse/trim exact');lines.push('PASS stereo sample with reverse, trim and fractional tuning — sample-identical output');results.textContent=lines.join('\n');document.documentElement.dataset.result='passed';
}catch(error){results.textContent=lines.join('\n')+'\nFAIL '+error.stack;document.documentElement.dataset.result='failed';throw error}
</script></html>
