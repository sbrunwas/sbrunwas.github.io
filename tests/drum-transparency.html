<!doctype html><html lang="en"><meta charset="utf-8"><title>Afterglow drum transparency</title><pre id="results">Running…</pre><script type="module">
import {createEngine} from '../clawstudio/wasm-runtime.js';
import {createInitialState} from '../clawstudio/state.js';
import {createStudioMaster,createStudioChannel,setChannelTone} from '../clawstudio/studio-mix.js';
const assert=(ok,message)=>{if(!ok)throw Error(message)},results=document.querySelector('#results'),lines=[];
const difference=(a,b,start=0)=>{let sum=0;for(let i=start;i<a.length;i++)sum+=(a[i]-b[i])**2;return Math.sqrt(sum/(a.length-start))};
async function render(input,{color='CLEAN',heat=0,cut=1}={}){
 const ctx=new OfflineAudioContext(2,input[0].length,48000),buffer=ctx.createBuffer(2,input[0].length,48000);input.forEach((data,i)=>buffer.copyToChannel(data,i));
 const source=ctx.createBufferSource();source.buffer=buffer;const channel=createStudioChannel(ctx),meter=ctx.createGain(),bus=createStudioMaster(ctx,meter);bus.master.connect(bus.drive);meter.connect(ctx.destination);channel.gain.connect(bus.master);source.connect(channel.input);bus.setColor(color);bus.setDrive(heat);setChannelTone(channel,{low:.5,lm:.5,hm:.5,hi:.5,cut,res:0},0);source.start(0);return ctx.startRendering();
}
try{
 const module=await WebAssembly.compile(await(await fetch('../clawstudio/afterglow.wasm')).arrayBuffer());
 for(const model of [0,1,3,4]){
  const engine=createEngine(module,48000),state=createInitialState();state.voices.forEach(voice=>voice.model=model);engine.setState(state);engine.play();const input=[new Float32Array(96000),new Float32Array(96000)];
  for(let offset=0;offset<96000;offset+=128){const length=Math.min(128,96000-offset),pair=engine.render(length);pair.forEach((channel,i)=>input[i].set(channel,offset))}engine.destroy();
  const clean=await render(input);for(let i=0;i<2;i++)assert(difference(input[i],clean.getChannelData(i))<1e-7,'clean studio path preserves original model '+model+' channel '+i);
  const glue=await render(input,{color:'GLUE',heat:.14}),filtered=await render(input,{cut:.3}),heated=await render(input,{heat:.3});
  assert(difference(clean.getChannelData(0),glue.getChannelData(0),12000)>1e-4,'Glue remains audible');assert(difference(clean.getChannelData(0),heated.getChannelData(0),12000)>1e-4,'Heat remains available');assert(difference(clean.getChannelData(0),filtered.getChannelData(0),12000)>1e-4,'channel filter still works');
  lines.push('PASS engine '+model+': clean studio path nulls against direct Afterglow output; Glue, Heat and channel filter stay usable');results.textContent=lines.join('\n');
 }
 document.documentElement.dataset.result='passed';
}catch(error){document.documentElement.dataset.result='failed';results.textContent=lines.join('\n')+'\nFAIL '+error.stack;throw error}
</script></html>
